global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs: 
      - bot_token_file: ./telegram_token
        chat_id_file: ./telegram_id
        send_resolved: true 
