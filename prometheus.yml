global:
  scrape_interval: 5s
  evaluation_interval: 15s

  external_labels:
      site: 'prod'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'vm'
    static_configs:
      - targets: ['192.168.2.195:9100']
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['victoriametrics:8428']
  - job_name: 'mysql'
    static_configs:
      - targets: ['192.168.2.195:9104']
  - job_name: 'blackbox_cms'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://192.168.2.195/         
          - http://192.168.2.195/admin/   
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.2.195:9115 

remote_write:
  - url: "http://victoriametrics:8428/api/v1/write"
